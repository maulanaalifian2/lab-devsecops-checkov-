name: "IaC Security Scan dengan Checkov"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "dockerfile/**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Python & Install Checkov"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run Checkov & Fix SARIF URI"
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --check CKV_AWS_20,CKV_AWS_19,CKV_AWS_18 --soft-fail -o cli -o sarif --output-file-path console,results.sarif
          python3 -c '
          import json, glob
          sarif_files = glob.glob("*.sarif")
          print("File SARIF ditemukan:", sarif_files)
          with open(sarif_files[0], "r") as f:
              data = json.load(f)
          for run in data.get("runs", []):
              for res in run.get("results", []):
                  for loc in res.get("locations", []):
                      uri = loc["physicalLocation"]["artifactLocation"]["uri"]
                      uri = uri.lstrip("/")
                      if not uri.startswith("terraform/"):
                          uri = "terraform/" + uri
                      loc["physicalLocation"]["artifactLocation"]["uri"] = uri
                      print("Fixed URI:", uri, "Rule:", res.get("ruleId"))
          with open("final-checkov.sarif", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: "Upload SARIF ke GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: final-checkov.sarif
