name: "IaC Security Scan dengan Checkov"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "dockerfile/**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Python & Install Checkov"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run Checkov & Prepare SARIF"
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --check CKV_AWS_20,CKV_AWS_19,CKV_AWS_18 --soft-fail -o sarif --output-file-path out_sarif
          python3 -c '
          import json, glob, sys
          files = glob.glob("**/*.sarif", recursive=True)
          print("SARIF ditemukan:", files)
          if not files:
              sys.exit(1)
          with open(files[0], "r") as f:
              data = json.load(f)
          total_alerts = 0
          for run in data.get("runs", []):
              results = run.get("results", [])
              total_alerts += len(results)
              for res in results:
                  res["level"] = "error"
                  for loc in res.get("locations", []):
                      uri = loc["physicalLocation"]["artifactLocation"]["uri"].lstrip("/")
                      if not uri.startswith("terraform/"):
                          uri = "terraform/" + uri
                      loc["physicalLocation"]["artifactLocation"]["uri"] = uri
                      print("Alert:", res.get("ruleId"), "->", uri)
          print("Total alerts siap upload:", total_alerts)
          with open("final-checkov.sarif", "w") as f:
              json.dump(data, f, indent=2)
          '

      - name: "Upload SARIF ke GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: final-checkov.sarif
