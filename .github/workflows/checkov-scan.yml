name: "IaC Security Scan dengan Checkov"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Python & Install Checkov"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run Checkov & Prepare SARIF"
        id: checkov-terraform
        continue-on-error: true
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --check CKV_AWS_20,CKV_AWS_19,CKV_AWS_18 -o cli -o sarif --output-file-path console,sarif_out
          python3 -c '
          import json, glob
          files = glob.glob("**/*.sarif", recursive=True)
          print("SARIF ditemukan:", files)
          if files:
              with open(files[0]) as f:
                  data = json.load(f)
              for run in data.get("runs", []):
                  for res in run.get("results", []):
                      res["level"] = "error"
                      for loc in res.get("locations", []):
                          uri = loc["physicalLocation"]["artifactLocation"]["uri"].lstrip("/")
                          if not uri.startswith("terraform/"):
                              uri = "terraform/" + uri
                          loc["physicalLocation"]["artifactLocation"]["uri"] = uri
              with open("ready.sarif", "w") as f:
                  json.dump(data, f, indent=2)
          '

      - name: "Upload SARIF ke GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('ready.sarif') != ''
        with:
          sarif_file: ready.sarif
          category: "checkov-terraform"

      - name: "Block pipeline jika ditemukan pelanggaran di Terraform"
        if: steps.checkov-terraform.outcome == 'failure'
        run: |
          echo "Checkov menemukan pelanggaran keamanan pada Terraform!"
          exit 1
