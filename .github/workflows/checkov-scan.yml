name: "IaC Security Scan dengan Checkov"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "kubernetes/**"
      - "dockerfile/**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-scan:
    name: "Checkov Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Python & Install Checkov"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run Checkov - Terraform"
        run: |
          pip install checkov
          checkov -d terraform --framework terraform --check CKV_AWS_20,CKV_AWS_19,CKV_AWS_18 --soft-fail -o cli -o sarif --output-file-path console,results.sarif
          ls -la

      - name: "Upload SARIF ke GitHub Security tab"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
